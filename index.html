<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英検準2級 書ける単語マスター（お試し版）</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:#f3f6fb;color:#1f2937}
  header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:18px}
  header p{margin:4px 0 0;font-size:12px;opacity:.9}
  .steps{display:flex;gap:4px;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb;overflow-x:auto}
  .step{flex:1;min-width:64px;text-align:center;font-size:12px;padding:6px 4px;border-radius:8px;background:#eef2ff;color:#6b7280;white-space:nowrap}
  .step.on{background:#2563eb;color:#fff;font-weight:bold}
  .step.done{background:#c7d2fe;color:#1e3a8a}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:14px}
  .word{font-size:34px;font-weight:bold;color:#1e3a8a;display:flex;align-items:center;gap:10px}
  .pos{display:inline-block;font-size:12px;background:#e0e7ff;color:#3730a3;border-radius:6px;padding:2px 8px;margin-right:6px}
  .mean{font-size:20px;margin:8px 0}
  .pattern{background:#fef3c7;border-left:4px solid #f59e0b;padding:10px 12px;border-radius:6px;margin:10px 0;font-size:15px}
  .pattern b{color:#b45309}
  .ex{margin:8px 0;padding:10px;background:#f9fafb;border-radius:8px}
  .ex .en{font-size:16px}
  .ex .ja{font-size:13px;color:#6b7280;margin-top:4px}
  .tip{font-size:13px;color:#065f46;background:#ecfdf5;border-radius:8px;padding:8px 10px;margin-top:8px}
  .spk{border:none;background:#eef2ff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
  button.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
  .primary{background:#2563eb;color:#fff}
  .ghost{background:#e5e7eb;color:#374151}
  .row{display:flex;gap:8px}.row .btn{flex:1}
  .q{font-size:17px;line-height:1.7;margin:6px 0 12px}
  .blank{display:inline-block;min-width:80px;border-bottom:2px solid #2563eb;text-align:center;color:#2563eb;font-weight:bold}
  .choice{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:2px solid #e5e7eb;background:#fff;border-radius:10px;font-size:16px;cursor:pointer}
  .choice.ok{border-color:#10b981;background:#ecfdf5}
  .choice.ng{border-color:#ef4444;background:#fef2f2}
  .fb{margin-top:10px;padding:12px;border-radius:10px;font-size:14px;line-height:1.6}
  .fb.ok{background:#ecfdf5}.fb.ng{background:#fef2f2}
  .tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:2px dashed #cbd5e1;border-radius:10px;margin:8px 0}
  .tile{padding:8px 11px;background:#eef2ff;border-radius:8px;font-size:16px;cursor:pointer;user-select:none}
  .answer .tile{background:#dbeafe}
  textarea{width:100%;font-size:16px;padding:10px;border:2px solid #cbd5e1;border-radius:10px;font-family:inherit;line-height:1.6}
  .model{background:#eff6ff;border-radius:10px;padding:10px 12px;margin-top:8px}
  mark{background:#fde68a;padding:0 2px;border-radius:3px}
  .chk{font-size:14px;margin:4px 0}
  .small{font-size:12px;color:#6b7280}
  .progress{font-size:13px;color:#6b7280;margin-bottom:6px}
  .score{font-size:56px;font-weight:bold;text-align:center;color:#2563eb}
  .gold{color:#d97706;text-shadow:0 0 12px #fcd34d}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{border-bottom:1px solid #e5e7eb;padding:6px;text-align:center}
  .confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:99;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
  .lock{opacity:.8;border:2px dashed #a78bfa;background:#faf5ff}
  .mode{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid #e0e7ff;border-radius:14px;padding:14px;margin-bottom:10px;font-size:16px;cursor:pointer;font-family:inherit;color:inherit}
  .mode:active{background:#eef2ff}.mi{font-size:30px}
  .part{background:#1e3a8a;color:#fff;border-radius:8px;padding:8px 12px;font-weight:bold;margin-bottom:10px;font-size:14px}
  .fbcard{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid #ef4444;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .fbcard.ok{border-left-color:#10b981}
  .expl{background:#fffbeb;border-radius:8px;padding:10px;margin-top:8px;font-size:14px;line-height:1.7}
  .near{background:#fde68a;border-radius:6px;padding:1px 6px;font-size:12px;text-decoration:none;display:inline-block}
  .typebox{flex:1;text-align:center;background:#eef2ff;border-radius:8px;padding:6px}
  .plan{border-top:1px solid #e5e7eb;padding:10px 0}
  .starter{background:#f9fafb;border-radius:8px;padding:8px;margin-top:4px;font-size:15px}
  .chip{display:inline-block;font-size:13px;background:#f3f4f6;border-radius:12px;padding:3px 9px;margin:2px}
  .chip.on{background:#d1fae5}
  .redo{background:#fef3c7;color:#92400e;border-radius:6px;padding:2px 8px;font-weight:bold}
  header{cursor:pointer}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:8px}
  .homebtn{border:none;background:#fff;border-radius:18px;padding:6px 14px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.1);cursor:pointer}
  .relbox{background:#f5f3ff;border-radius:10px;padding:10px 12px;margin-top:10px}
  .relrow{padding:6px 0;border-top:1px dashed #ddd6fe}
  .relmini{font-size:13px;margin-top:8px;color:#4c1d95;line-height:1.9}
  .rtag{display:inline-block;font-size:11px;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:1px 6px;margin-right:5px}
  .selrow{display:block;padding:10px 4px;border-bottom:1px solid #e5e7eb;font-size:16px}
  .selrow input{transform:scale(1.3);margin-right:8px}
</style>
</head>
<body>
<header onclick="goHome()">
  <h1>英検準2級 書ける単語マスター <span style="font-size:12px;background:#fff3;padding:2px 6px;border-radius:6px">お試し版</span></h1>
  <p>覚えた単語を、そのまま英作文で使えるようにするアプリ</p>
</header>
<div class="steps" id="steps"></div>
<main><div id="top"></div><div id="app"></div></main>

<script>
// ===== データ（準2級・英作文で使える5語） =====
const WORDS = [
 {w:"allow", pos:"動詞", mean:"～を許す／（物事が）～を可能にする",
  pattern:"<b>allow A to 〜</b>（Aが〜するのを可能にする）",
  ex:[{en:"The Internet allows us to learn anytime.",ja:"インターネットのおかげで、私たちはいつでも学べる。"}],
  tip:"英作文の「理由」で大活躍！ 主語に物を置いて「〇〇のおかげで人が〜できる」と書ける。",
  quiz:{q:"Smartphones ___ students to study anywhere.",ja:"スマホのおかげで、生徒はどこでも勉強できる。",ans:"allow",
   dis:[["approve","承認する：「人が〜するのを」の形をとらない"],["arrange","手配する：allow A to 〜 の形にならない"],["attend","出席する：後ろに人＋to〜は来ない"]]},
  order:{ja:"このアプリのおかげで、私たちは英語を楽しく勉強できる。",en:"This app allows us to study English happily .",dummy:"for",dummyWhy:"allow 人 <b>to</b> 動詞。for は使わない",alt:"This app lets us study English happily.",altNote:"let なら to を消す"},
  rel:[{tag:"似た言葉",w:"let",note:"let 人 ＋ 動詞の原形（<b>to はつけない！</b>）",ex:"My parents let me go to the concert."},
   {tag:"似た言葉",w:"permit",note:"permit 人 to 〜（かたい言い方・規則や掲示で）"},
   {tag:"反対（参考）",w:"forbid",note:"〜を禁止する"}],
  relWhy:"allow と let は意味が同じでも形がちがう（to の有無）。英作文でいちばんまちがえやすいので、似た言葉とセットで。",
  trans:{ja:"オンライン授業のおかげで、生徒は家で学ぶことができる。",
   model:["Online classes allow students to learn at home.","Online lessons allow students to study at home."],
   need:[/allow(s|ed)?\s+\w+\s+to\s+\w+/i], needLabel:"allow ＋ 人 ＋ to 動詞 の形"}},
 {w:"available", pos:"形容詞", mean:"利用できる／手に入る",
  pattern:"<b>be available</b>（利用できる） / <b>available in ＋ 言語</b>（〜語で利用できる） / <b>available online</b>",
  ex:[{en:"Many books are available online.",ja:"多くの本がネットで手に入る。"}],
  tip:"「便利になった」系の理由で使える。can be used より英検っぽく見える。",
  quiz:{q:"Free Wi-Fi is ___ at the station.",ja:"駅では無料Wi-Fiが利用できる。",ans:"available",
   dis:[["annual","毎年の：Wi-Fiが『毎年の』では意味が通らない"],["artificial","人工の：意味が合わない"],["automatic","自動の：『無料Wi-Fiは自動だ』は不自然"]]},
  order:{ja:"このアプリは英語と日本語で利用できる。",en:"This app is available in English and Japanese .",dummy:"on",dummyWhy:"言語は available <b>in</b>。on は使わない",alt:"You can use this app in English and Japanese.",altNote:"can use で言い換え"},
  rel:[{tag:"似た言葉",w:"free",note:"（人・席が）空いている：Are you available? ≒ Are you free?"},
   {tag:"反対",w:"unavailable",note:"利用できない・手に入らない（= not available）"},
   {tag:"言い換え",w:"can use / can get",note:"〜を使える／手に入れられる"}],
  relWhy:"available は意味が広い。場面ごとの言い換えで覚えると、英検の言い換え問題に強くなる。",
  trans:{ja:"今では多くの映画がネットで見られる（利用できる）。",
   model:["Now many movies are available online.","Many movies are now available on the Internet."],
   need:[/\b(is|are|be)\s+(now\s+)?available\b/i], needLabel:"be動詞 ＋ available"}},
 {w:"aware", pos:"形容詞", mean:"気づいている／知っている",
  pattern:"<b>be aware of 〜</b>（〜に気づいている・〜を意識している）",
  ex:[{en:"People should be aware of the dangers of plastic.",ja:"人々はプラスチックの危険を意識するべきだ。"}],
  tip:"環境・健康のお題で「〜を意識するようになる」と書ける。become aware of も便利。",
  quiz:{q:"Young people should be ___ of the risks of the Internet.",ja:"若者はネットの危険を意識するべきだ。",ans:"aware",
   dis:[["ashamed","恥じて：be ashamed of は『〜を恥じる』で意味がずれる"],["annoyed","いらいらして：of ではなく with/at をとる"],["calm","落ち着いた：of をとらない"]]},
  order:{ja:"私たちは環境問題を意識するべきだ。",en:"We should be aware of environmental problems .",dummy:"to",dummyWhy:"be aware <b>of</b>。to は使わない",alt:"We should know about environmental problems.",altNote:"know about で言い換え"},
  rel:[{tag:"似た言葉",w:"know about",note:"〜について知っている"},
   {tag:"似た言葉",w:"realize / notice",note:"become aware of（〜に気づく）≒ realize / notice"},
   {tag:"反対",w:"unaware",note:"気づいていない（be unaware of 〜）"}],
  relWhy:"英検の長文やリスニングでは、aware が know / realize に言い換えられて出る。",
  trans:{ja:"多くの人が健康の大切さに気づいている。",
   model:["Many people are aware of the importance of health.","A lot of people are aware of how important health is."],
   need:[/aware\s+of/i], needLabel:"aware of の形"}},
 {w:"although", pos:"接続詞", mean:"～だけれども",
  pattern:"<b>Although S V, S V.</b>（〜だけれども、…だ）※後ろは文。名詞なら Despite",
  ex:[{en:"Although it is expensive, it is very useful.",ja:"高いけれども、とても役に立つ。"}],
  tip:"反対意見に一言ふれてから自分の意見を言うと、英作文の説得力アップ。but を連発しない工夫にも。",
  quiz:{q:"___ it was raining, we played soccer.",ja:"雨が降っていたけれど、私たちはサッカーをした。",ans:"Although",
   dis:[["Because","〜なので：『雨だったからサッカーした』は逆の意味"],["Unless","〜しない限り：過去の事実には合わない"],["If","もし〜なら：過去の事実には合わない"]]},
  order:{ja:"疲れていたけれど、彼は宿題を終えた。",en:"Although he was tired , he finished his homework .",dummy:"Despite",dummyWhy:"後ろが文（he was tired）なら <b>Although</b>。Despite の後ろは名詞",alt:"Even though he was tired, he finished his homework.",altNote:"even though でも同じ形"},
  rel:[{tag:"同じ使い方",w:"though / even though",note:"although と同じく後ろに文（even though は意味が強め）"},
   {tag:"紛らわしい",w:"despite / in spite of",note:"意味は同じでも、後ろは<b>名詞</b>（Despite the rain）"},
   {tag:"似た意味",w:"but",note:"文の途中でつなぐ（He was tired, but he 〜）"}],
  relWhy:"although に反対語はない。代わりに『意味は同じでも形がちがう語』を整理するのがいちばん役立つ。",
  trans:{ja:"スマホは便利だけれど、使いすぎるのはよくない。",
   model:["Although smartphones are useful, using them too much is not good.","Although smartphones are convenient, we should not use them too much."],
   need:[/^\s*although\b[^,]+,/i], needLabel:"Although ～, の形（カンマを忘れずに）"}},
 {w:"attract", pos:"動詞", mean:"～を引きつける／集める",
  pattern:"<b>attract A</b>（Aを引きつける） / <b>attract attention</b>（注目を集める） / <b>attract tourists</b>",
  ex:[{en:"The festival attracts many tourists every year.",ja:"その祭りは毎年多くの観光客を集める。"}],
  tip:"観光・地域・イベント系のお題で「人が集まる」を一語で言える。",
  quiz:{q:"The new park will ___ a lot of families.",ja:"新しい公園は多くの家族を引きつけるだろう。",ans:"attract",
   dis:[["attach","取り付ける：家族を『取り付ける』は意味が通らない"],["adopt","採用する：『家族を採用する』は不自然"],["announce","発表する：意味が合わない"]]},
  order:{ja:"その歌手の新曲は大きな注目を集めた。",en:"The singer's new song attracted a lot of attention .",dummy:"paid",dummyWhy:"注目を<b>集める</b>＝attract attention。pay attention は『自分が注意を払う』",alt:"The singer's new song drew a lot of attention.",altNote:"draw（drew）でも言える"},
  rel:[{tag:"なかま（形容詞）",w:"attractive",note:"魅力的な：英作文で使いやすい（an attractive city）"},
   {tag:"なかま（名詞）",w:"attraction",note:"魅力・名所（a tourist attraction＝観光名所）"},
   {tag:"似た言葉",w:"draw",note:"draw attention / draw visitors（引きつける）"}],
  relWhy:"attract は反対語より、なかまの attractive / attraction を一緒に覚えると英作文で使える幅が広がる。",
  trans:{ja:"その町は美しい景色で観光客を引きつけている。",
   model:["The town attracts tourists with its beautiful views.","The town's beautiful scenery attracts many tourists."],
   need:[/attract(s|ed|ing)?\b/i], needLabel:"attract を使っている"}}
];

// ===== テストモード用データ（意味・スペル・語法/コロケーション） =====
const TEST = [
 // --- スペル ---
 {w:"allow",type:"スペル",q:"Our school does not ___ students to use phones in class.",ja:"私たちの学校は、授業中に生徒がスマホを使うことを許していない。",ans:"allow",hint:"a で始まる5文字",
  fb:"allow は <b>l が2つ</b>（a-l-l-o-w）。「アラウ」と読むので alow / arrow と書きまちがえやすい。arrow（矢）とは別の単語！"},
 {w:"available",type:"スペル",q:"Is this seat ___?",ja:"この席は空いていますか（利用できますか）？",ans:"available",hint:"a で始まる9文字",
  fb:"a-<b>vai</b>-la-<b>ble</b> の3つに区切って覚えよう。真ん中の <b>ai</b> と、最後の <b>-able</b>（〜できる）がポイント。avail（役立つ）＋ able と考えると忘れにくい。"},
 {w:"aware",type:"スペル",q:"I wasn't ___ of the problem.",ja:"私はその問題に気づいていなかった。",ans:"aware",hint:"a で始まる5文字",
  fb:"a ＋ <b>ware</b>。where（どこ）や wear（着る）と混ざりやすい。「a-w-a-r-e」と声に出して3回書こう。"},
 {w:"although",type:"スペル",q:"___ it was cold, we went swimming.",ja:"寒かったけれど、私たちは泳ぎに行った。",ans:"although",hint:"a で始まる8文字",
  fb:"al は <b>l が1つ</b>だけ（all ではない！）。後ろは <b>though</b>（t-h-o-u-g-h）。gh は発音しないので落としやすい。"},
 {w:"attract",type:"スペル",q:"This event will ___ many visitors.",ja:"このイベントは多くの来場者を引きつけるだろう。",ans:"attract",hint:"a で始まる7文字",
  fb:"<b>at</b>-<b>tract</b>。t が2つ続く（att）。tract＝「引っぱる」という意味のパーツで、tractor（トラクター＝引っぱる車）と同じ仲間。"},
 // --- 意味 ---
 {w:"allow",type:"意味",q:"allow",opts:["～を可能にする・許す","～を承認する","～を手配する","～に出席する"],ans:0,
  fb:"allow＝「許す」が基本。英作文では <b>物 ＋ allow ＋ 人 ＋ to 〜</b>＝「物のおかげで人が〜できる」の形で使うと便利。ほかの選択肢：approve（承認する）、arrange（手配する）、attend（出席する）。",ex:"The Internet allows us to learn anytime."},
 {w:"available",type:"意味",q:"available",opts:["利用できる・手に入る","毎年の","人工の","自動の"],ans:0,
  fb:"available＝「（今すぐ）使える・手に入る・（人が）手が空いている」。ほかの選択肢：annual（毎年の）、artificial（人工の）、automatic（自動の）。どれも a で始まる形容詞なので注意。",ex:"Many books are available online."},
 {w:"aware",type:"意味",q:"aware",opts:["気づいている・知っている","恥じている","いらいらしている","落ち着いている"],ans:0,
  fb:"aware＝「気づいている・意識している」。ほかの選択肢：ashamed（恥じている）、annoyed（いらいらしている）、calm（落ち着いている）。",ex:"People should be aware of the dangers of plastic."},
 {w:"although",type:"意味",q:"although",opts:["～だけれども","～なので","～しない限り","もし～なら"],ans:0,
  fb:"although＝「〜だけれども」。前と後ろが<b>反対の内容</b>になる。because（〜なので）、unless（〜しない限り）、if（もし〜なら）と区別しよう。",ex:"Although it is expensive, it is very useful."},
 {w:"attract",type:"意味",q:"attract",opts:["～を引きつける・集める","～を取り付ける","～を採用する","～を発表する"],ans:0,
  fb:"attract＝「引きつける」。人や注目を集めるときに使う。ほかの選択肢：attach（取り付ける）、adopt（採用する）、announce（発表する）。attract と attach は形が似ているので要注意。",ex:"The festival attracts many tourists every year."},
 // --- 語法・コロケーション ---
 {w:"allow",type:"語法",q:"My parents allowed me ___ go to the concert.",opts:["to","for","that","going"],ans:0,
  fb:"<b>allow ＋ 人 ＋ to ＋ 動詞の原形</b>（人が〜するのを許す）。✕ allow me going ／ ✕ allow me for ／ ✕ allow that S V はダメ。同じ形をとる仲間：want 人 to 〜、ask 人 to 〜、tell 人 to 〜。",ex:"My parents allowed me to go to the concert."},
 {w:"available",type:"語法",q:"This book is available ___ Japanese.",opts:["in","on","at","of"],ans:0,
  fb:"<b>available in ＋ 言語・色・サイズ</b>（〜で手に入る）。ほかにもよく使うセット：<b>available online</b>（ネットで手に入る）、<b>available to ＋ 人</b>（人が利用できる）、<b>available for ＋ 用途</b>。",ex:"This book is available in Japanese."},
 {w:"aware",type:"語法",q:"We should be aware ___ the dangers of the Internet.",opts:["of","to","with","at"],ans:0,
  fb:"<b>be aware of ＋ 名詞</b>（〜に気づいている）。後ろに文を続けたいときは <b>be aware that S V</b>。「〜に気づくようになる」は <b>become aware of</b>。似た形の ashamed of（恥じる）とセットで覚えると混乱しにくい。",ex:"We should be aware of the dangers of the Internet."},
 {w:"although",type:"語法",q:"___ it was raining, we played soccer.",opts:["Although","Despite","In spite of","Because of"],ans:0,

const STEP_NAMES=["① であう","② みわける","③ ならべる","④ かく","結果"];
let S;
function resetStudy(sel){sel=sel||ALL;S={mode:"study",sel,step:0,i:0,list:sel,review:false,round:1,res:{quiz:[],order:[],trans:[]},cur:{quiz:[],order:[],trans:[]},mine:{quiz:[],order:[],trans:[]}}}
function home(){S={mode:"home"};render();scrollTo(0,0)}

function relBox(o,compact){if(!o.rel)return"";
 if(compact)return `<div class="relmini">🔗 ${o.rel.map(r=>`<span class="rtag">${r.tag}</span><b>${r.w}</b>`).join("　")}</div>`;
 return `<div class="relbox"><b>🔗 似た言葉・反対の言葉</b>${o.rel.map(r=>`<div class="relrow"><span class="rtag">${r.tag}</span>${r.w.split(" / ").map(x=>`<b>${x}</b> ${spk(x)}`).join('<span class="small"> ／ </span>')}<div class="small">${r.note}</div>${r.ex?`<div class="small">例：${hl(r.ex)}</div>`:""}</div>`).join("")}<div class="small" style="margin-top:6px">📌 ${o.relWhy}</div></div>`}
function viewSelect(){
 $("#app").innerHTML=`<div class="card"><b>📘 学習する単語をえらぼう</b><div class="small" style="margin-top:4px">チェックした単語だけで学習します</div>
  ${WORDS.map((o,k)=>`<label class="selrow"><input type="checkbox" class="selw" value="${k}" checked> <b>${o.w}</b> <span class="small">${o.mean}</span></label>`).join("")}

function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;
 const v=speechSynthesis.getVoices().find(v=>/en-US/.test(v.lang)&&/(Natural|Neural|Google)/.test(v.name));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function spk(t){return `<button class="spk" onclick="speak(this.dataset.t)" data-t="${esc(t)}">🔊</button>`}
const $=s=>document.querySelector(s);

function renderSteps(){const el=$("#steps");if(S.mode!=="study"){el.style.display="none";return}
 el.style.display="flex";el.innerHTML=STEP_NAMES.map((n,k)=>`<div class="step ${k===S.step?'on':k<S.step?'done':''}">${n}</div>`).join("")}

function isOk(sec,w){return sec==="trans"?S.cur.trans[w]===2:S.cur[sec][w]===true}

 $("#top").innerHTML=S.mode==="home"?"":`<div class="topbar"><button class="homebtn" onclick="goHome()">🏠 ホーム</button></div>`}

function stepOrder(){const o=WORDS[wi()],tokens=o.order.en.split(" ");let pool=shuffle([...tokens,...(o.order.dummy?[o.order.dummy]:[])].map((t,k)=>({t,k}))),ans=[],done=false;
 const draw=()=>{$("#app").innerHTML=`${prog()}<div class="card"><div class="small">日本語に合うように、タップして英文を組み立てよう<br>⚠️ <b>使わないカードが1枚</b>まざっているよ（語法に注意！）</div>

  <div id="fb"></div></div>${ans.length>=tokens.length?'<button class="btn primary" id="chk">答え合わせ</button>':''}`;
  document.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>{ans.push(pool.splice(e.dataset.p,1)[0]);draw()});

   c.remove();$("#fb").innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'⭕ 正解！':'❌ 惜しい！'}</b><br>正解：${hl(sent)} ${spk(sent)}<br><span class="small">型：${o.pattern}</span>${o.order.dummy?`<div class="expl">🚫 ダミーの「<b>${o.order.dummy}</b>」：${o.order.dummyWhy}</div>`:""}${o.order.alt?`<div class="small" style="margin-top:6px">🔗 言い換えると：${hl(o.order.alt)} ${spk(o.order.alt)}（${o.order.altNote}）</div>`:""}</div>

 draw();}

// セクションごとのふりかえり
const SEC_TITLE=["","② みわける","③ ならべる","④ かく"];
function sectionReview(){const sec=SEC[S.step],items=S.list,wrong=items.filter(w=>!isOk(sec,w)),good=items.filter(w=>isOk(sec,w)),n=items.length;
 const card=(w)=>{const o=WORDS[w],ok=isOk(sec,w),mine=S.mine[sec][w];let body="";
  if(sec==="quiz"){const z=o.quiz,full=z.q.replace("___",z.ans),d=z.dis.find(x=>x[0]===mine);
   body=`<div class="q" style="margin:4px 0">${esc(z.q).replace("___",'<span class="blank">'+(ok?z.ans:'？')+'</span>')}</div>
    ${ok?`<div>⭕ 正解：<b>${z.ans}</b></div>`:`<div>あなたの答え：<s>${esc(mine)}</s></div><div>正解：<b style="color:#047857">${z.ans}</b></div>`}
    <div class="expl">📖 <b>${z.ans}</b>＝${o.mean}<br>型：${o.pattern}${d?`<br>❗ あなたが選んだ <b>${d[0]}</b> は「${d[1]}」`:""}</div>
    <div class="ex"><div class="en">${hl(full)} ${spk(full)}</div><div class="ja">${z.ja}</div></div>`}
  else if(sec==="order"){const sent=o.order.en.replace(/ ([.,])/g,"$1");
   body=`<div class="small">${o.order.ja}</div>
    ${ok?"":`<div style="margin-top:4px">あなたの並べ方：<s>${esc(mine)}</s></div>`}
    <div>正解：<b style="color:#047857">${hl(sent)}</b> ${spk(sent)}</div>
    <div class="expl">📖 型：${o.pattern}${o.order.dummy?`<br>🚫 ダミー「${o.order.dummy}」：${o.order.dummyWhy}`:""}${o.order.alt?`<br>🔗 言い換え：${hl(o.order.alt)}`:""}</div>`}
  else{const t=o.trans,lab=["❌ ダメ","🔺 おしい","⭕ 書けた"][S.cur.trans[w]];
   body=`<div class="small">${t.ja}</div>
    <div style="margin-top:4px">あなたの英文：${esc(mine||"")}　<span class="chip">${lab}</span></div>
    <div class="model"><b>模範解答</b>${t.model.map(m=>`<div>・${hl(m)} ${spk(m)}</div>`).join("")}</div>
    <div class="expl">📖 チェックポイント：${t.needLabel}<br>型：${o.pattern}</div>`}
  return `<div class="fbcard ${ok?'ok':'ng'}"><div class="small"><b style="font-size:16px;color:#1e3a8a">${o.w}</b></div>${body}${relBox(o,true)}</div>`};
 const nextLabel=S.step<3?`${SEC_TITLE[S.step+1]} へ進む`:"結果を見る";
 const msg=wrong.length===0?(S.round>1?"やり直しで全部クリア！しっかり身につきました。":"全問クリア！このセクションはバッチリです。"):
  `${n}問中 ${good.length}問クリア。まちがえた ${wrong.map(w=>`<b>${WORDS[w].w}</b>`).join("、")} を下の解説で確認して、もう一度やってみよう。`;
 $("#app").innerHTML=`<div class="card" style="text-align:center"><div class="small">${SEC_TITLE[S.step]} のふりかえり${S.round>1?`（やり直し ${S.round-1}回目）`:""}</div>
  <div class="score" style="font-size:44px">${good.length} / ${n}</div><div style="line-height:1.7">${msg}</div></div>
  ${wrong.length?`<button class="btn primary" onclick="redo()">🔁 まちがえた単語だけもう一度（${wrong.length}語）</button>`:""}
  ${wrong.length?`<h3 style="margin:16px 4px 8px">❌ まちがえた単語の解説</h3>${wrong.map(card).join("")}`:""}
  ${good.length?`<details class="card"><summary><b>⭕ できた単語も確認する（${good.length}語）</b></summary>${good.map(card).join("")}</details>`:""}
  ${wrong.length?`<button class="btn primary" onclick="redo()">🔁 まちがえた単語だけもう一度（${wrong.length}語）</button>`:""}
  <button class="btn ${wrong.length?'ghost':'primary'}" onclick="go(${S.step+1})">${nextLabel}${wrong.length?'（やり直さずに進む）':''}</button>`;
 if(!wrong.length&&S.round>1)confetti(false);}

// 学習モードの結果
function mk(sec,k){const f=S.res[sec][k],first=sec==="trans"?f===2:f===true;if(first)return'⭕';const a=sec==="trans"?['❌','🔺','⭕'][f??0]:'❌';return isOk(sec,k)?a+'→⭕':a}
function stepResult(){const q=S.res.quiz.filter(Boolean).length,o=S.res.order.filter(Boolean).length,t=S.res.trans.reduce((a,b)=>a+(b||0),0)/2,
  pct=Math.round((q+o+t)/(S.sel.length*3)*100), lv=pct>=90?'S':pct>=70?'A':'';
 $("#app").innerHTML=`<div class="card" style="text-align:center"><div class="small">学習モードのスコア</div>
  <div class="score ${lv==='S'?'gold':''}">${pct}%</div>
  <div style="font-size:20px;font-weight:bold">${lv==='S'?'🏆 S級合格！':lv==='A'?'🎉 合格！':'あと少し！もう一回やってみよう'}</div>
  <div class="small">合格ライン 70% ／ S級 90%</div></div>
  <div class="card"><table><tr><th>単語</th><th>みわける</th><th>ならべる</th><th>かく</th></tr>
  ${S.sel.map(k=>[WORDS[k],k]).map(([w,k])=>`<tr><td><b>${w.w}</b></td><td>${mk('quiz',k)}</td><td>${mk('order',k)}</td><td>${mk('trans',k)}</td></tr>`).join("")}
  </table><div class="small" style="margin-top:6px">点数は1回目の答えで計算／❌→⭕ ＝ やり直しでクリア</div></div>
  <div class="card" style="background:#eff6ff"><b>次はどうする？</b><div class="small">覚えたか確かめるなら「テストモード」がおすすめ！</div>
  <button class="btn primary" onclick="startTest()">📝 テストモードへ</button>
  <button class="btn ghost" onclick="S={mode:'challenge',c:null};render()">✍️ チャレンジモード（英作文）</button></div>
  <button class="btn ghost" onclick="resetStudy(S.sel);render()">同じ単語でもう一度学習する</button>
  <button class="btn ghost" onclick="S={mode:'select'};render()">単語をえらび直す</button>
  <button class="btn ghost" onclick="home()">ホームへ</button>`;
 if(lv)confetti(lv==='S');}

// ===== ホーム =====
function viewHome(){
 $("#app").innerHTML=`<div class="card"><div class="small">今日の単語（英検準2級）</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${WORDS.map(o=>`<span class="tile">${o.w}</span>`).join("")}</div></div>
  <button class="mode" onclick="S={mode:'select'};render()"><span class="mi">📘</span><span><b>学習モード</b><br><span class="small">であう → みわける → ならべる → かく（短い英訳）</span></span></button>
  <button class="mode" onclick="startTest()"><span class="mi">📝</span><span><b>テストモード</b><br><span class="small">スペル・意味・語法・言い換え 全20問。終わったらていねいに解説</span></span></button>
  <button class="mode" onclick="S={mode:'challenge',c:null};render()"><span class="mi">✍️</span><span><b>チャレンジモード</b><br><span class="small">英検準2級の英作文に挑戦。書く内容と使う単語をヒントで提案</span></span></button>
  <div class="card lock">🔒 <b>製品版では…</b><br><span class="small">中1〜準1級まで約3,800語を10語ずつ／苦手な単語が次回また出る復習機能／英作文のお題がたくさん</span></div>`;}

// ===== テストモード =====
const PARTS=["スペル","意味","語法","言い換え"];
const PART_LABEL={"スペル":"Part 1　スペル（書けるかな？）","意味":"Part 2　意味（わかるかな？）","語法":"Part 3　語法・コロケーション（使えるかな？）","言い換え":"Part 4　言い換え・似た言葉（広げられるかな？）"};
TEST.forEach((q,i)=>q.id=i);
function prepQ(q){const c={...q};if(c.opts)c.order=shuffle(c.opts.map((_,i)=>i));return c}
function startTest(){S={mode:"test",phase:"run",part:0,round:1,k:0,first:{},last:{},ans:{}};startPart();render();scrollTo(0,0)}
function startPart(){S.cur=shuffle(TEST.filter(x=>x.type===PARTS[S.part])).map(prepQ);S.k=0;S.round=1;S.phase="run"}
function lev(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function judge(q,a){if(q.type==="スペル"){const v=(a||"").trim().toLowerCase();return v===q.ans}return a===q.ans}
function testAnswer(a){const q=S.cur[S.k],ok=judge(q,a);S.ans[q.id]=a;S.last[q.id]=ok;if(S.first[q.id]===undefined)S.first[q.id]=ok;
 S.k++;if(S.k>=S.cur.length)S.phase="partReview";render();scrollTo(0,0)}
function ansText(q){let at=q.type==="スペル"?q.ans:q.opts[q.ans];if(q.q.startsWith("___"))at=at[0].toUpperCase()+at.slice(1);return at}

function viewTest(){if(S.phase==="result")return testResult();if(S.phase==="partReview")return partReview();
 const q=S.cur[S.k],n=S.cur.length;
 let body="";
 if(q.type==="スペル"){
  body=`<div class="small">日本語の意味に合う単語を<b>キーボードで</b>書こう</div>
   <div class="q">${esc(q.q).replace("___",'<span class="blank">？</span>')}</div><div class="small">${q.ja}</div>
   <div class="small" style="margin:6px 0">ヒント：${q.hint}</div>
   <input id="sp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;font-size:20px;padding:10px;border:2px solid #cbd5e1;border-radius:10px">
   <button class="btn primary" id="go">答える</button>`;
 }else{
  body=`<div class="small">${q.type==="意味"?"この単語の意味は？":"空所に入るものを選ぼう"}</div>
   <div class="q">${q.type==="意味"?`<span style="font-size:30px;font-weight:bold;color:#1e3a8a">${q.q}</span> ${spk(q.q)}`:esc(q.q).replace("___",'<span class="blank">？</span>')}</div>
   ${q.order.map(i=>`<button class="choice" onclick="testAnswer(${i})">${esc(q.opts[i])}</button>`).join("")}`;
 }
 $("#app").innerHTML=`<div class="part">${PART_LABEL[q.type]}${S.round>1?'　🔁 やり直し':''}</div>
  <div class="progress">📝 ${S.k+1} / ${n}</div>
  <div style="height:6px;background:#e5e7eb;border-radius:3px;margin-bottom:10px"><div style="height:6px;width:${S.k/n*100}%;background:#2563eb;border-radius:3px"></div></div>
  <div class="card">${body}</div><div class="small" style="text-align:center">答え合わせはこのPartの最後にまとめて行います</div>`;
 if(q.type==="スペル"){const i=$("#sp");i.focus();const f=()=>{if(!i.value.trim()){alert("書いてみよう！わからなければ思いつく形でOK");return}testAnswer(i.value)};
  $("#go").onclick=f;i.onkeydown=e=>{if(e.key==="Enter")f()}}}

function qCard(q,a,good){let mine;
 if(q.type==="スペル"){const v=(a||"").trim();mine=esc(v||"（空欄）");const d=lev(v.toLowerCase(),q.ans);if(!good&&d<=2)mine+=` <span class="near">おしい！あと${d}文字</span>`;}
 else mine=esc(q.opts[a]);
 const at=ansText(q),full=q.type==="意味"?q.ex:q.q.replace("___",at),right=q.type==="スペル"?q.ans:q.opts[q.ans];
 return `<div class="fbcard ${good?'ok':'ng'}"><div class="small">${q.type}｜<b>${q.w}</b></div>
  <div class="q" style="margin:4px 0">${q.type==="意味"?`<b>${q.q}</b> の意味`:esc(q.q).replace("___",'<span class="blank">'+(good?esc(at):'？')+'</span>')}</div>
  ${good?`<div>⭕ 正解：<b>${esc(right)}</b></div>`:`<div>あなたの答え：<s>${mine}</s></div><div>正解：<b style="color:#047857">${esc(right)}</b></div>`}
  <div class="expl">📖 ${q.fb}</div>
  ${full?`<div class="ex"><div class="en">${hl(full)} ${spk(full)}</div>${q.ja?`<div class="small">${q.ja}</div>`:""}</div>`:""}</div>`}

const PART_ADVICE={"スペル":"スペルは、声に出して読みながらノートに3回ずつ書くと手が覚えます。",
 "意味":"意味があいまいな単語は、学習モードの「であう」で例文ごと読み直すとイメージで覚えられます。",
 "語法":"語法・コロケーションは、単語だけでなく「allow 人 to 〜」「aware of」のように<b>前後のセットごと</b>覚えるのがコツです。",
 "言い換え":"言い換えは、学習モードの「であう」の🔗似た言葉・反対の言葉を読み直そう。let（to なし）や attractive（形容詞）など、<b>形のちがい</b>に注目すると覚えやすいです。"};
function partReview(){const type=PARTS[S.part],qs=S.cur,ok=qs.map(q=>S.last[q.id]),good=ok.filter(Boolean).length,n=qs.length;
 const wrong=qs.filter((q,k)=>!ok[k]),right=qs.filter((q,k)=>ok[k]);
 const nextLabel=S.part<PARTS.length-1?`${PART_LABEL[PARTS[S.part+1]].split("　")[0]}へ進む`:"テストの結果を見る";
 const msg=!wrong.length?(S.round>1?"やり直しで全部クリア！よくがんばりました。":"全問正解！このPartはバッチリです。"):
  `${n}問中 ${good}問正解。${PART_ADVICE[type]} 下の解説を読んでから、まちがえた問題だけもう一度やってみよう。`;
 $("#app").innerHTML=`<div class="part">${PART_LABEL[type]}　ふりかえり${S.round>1?`（やり直し ${S.round-1}回目）`:""}</div>
  <div class="card" style="text-align:center"><div class="score" style="font-size:44px">${good} / ${n}</div><div style="line-height:1.7">${msg}</div></div>
  ${wrong.length?`<button class="btn primary" onclick="testRedo()">🔁 まちがえた問題だけもう一度（${wrong.length}問）</button>`:""}
  ${wrong.length?`<h3 style="margin:16px 4px 8px">❌ まちがえた問題の解説</h3>${wrong.map(q=>qCard(q,S.ans[q.id],false)).join("")}`:""}
  ${right.length?`<details class="card"><summary><b>⭕ 正解した問題も確認する（${right.length}問）</b></summary>${right.map(q=>qCard(q,S.ans[q.id],true)).join("")}</details>`:""}
  ${wrong.length?`<button class="btn primary" onclick="testRedo()">🔁 まちがえた問題だけもう一度（${wrong.length}問）</button>`:""}
  <button class="btn ${wrong.length?'ghost':'primary'}" onclick="testNextPart()">${nextLabel}${wrong.length?'（やり直さずに進む）':''}</button>`;
 if(!wrong.length&&S.round>1)confetti(false);}
function testRedo(){S.cur=shuffle(S.cur.filter(q=>!S.last[q.id])).map(q=>prepQ(TEST[q.id]));S.k=0;S.round++;S.phase="run";render();scrollTo(0,0)}
function testNextPart(){S.part++;if(S.part>=PARTS.length){S.phase="result"}else startPart();render();scrollTo(0,0)}

function testResult(){const n=TEST.length,score=TEST.filter(q=>S.first[q.id]).length,pct=Math.round(score/n*100),lv=pct>=90?'S':pct>=70?'A':'';
 const byType=PARTS.map(p=>{const qs=TEST.filter(q=>q.type===p);return{p,ok:qs.filter(q=>S.first[q.id]).length,all:qs.length}});
 const words=[...new Set(TEST.map(q=>q.w))];
 const cell=(w,p)=>{const q=TEST.find(q=>q.w===w&&q.type===p);if(!q||S.first[q.id]===undefined)return'－';return S.first[q.id]?'⭕':S.last[q.id]?'❌→⭕':'❌'};
 const still=words.filter(w=>TEST.some(q=>q.w===w&&S.last[q.id]===false));
 const fixed=TEST.filter(q=>S.first[q.id]===false&&S.last[q.id]).length;
 const weakType=byType.filter(x=>x.ok<x.all).sort((a,b)=>a.ok/a.all-b.ok/b.all)[0];
 const msg=score===n?"1回目で全問正解！意味・スペル・使い方まで完璧です。この5語は英作文でも自信を持って使えます。":
  `1回目の正解は ${score}問。${fixed?`まちがえた問題のうち ${fixed}問は、やり直しでクリアできました。`:""}${weakType?`いちばん伸びしろがあるのは「${weakType.p}」です。${PART_ADVICE[weakType.p]}`:""}`;
 $("#app").innerHTML=`<div class="card" style="text-align:center"><div class="small">テスト結果（1回目の答えで採点）</div>
  <div class="score ${lv==='S'?'gold':''}">${score} / ${n}</div>
  <div style="font-size:20px;font-weight:bold">${lv==='S'?'🏆 S級合格！':lv==='A'?'🎉 合格！':'もう少し！'}</div>
  <div class="small">合格ライン 70% ／ S級 90%（正答率 ${pct}%）</div></div>
  <div class="card"><b>👩‍🏫 先生からのひとこと</b><div style="margin-top:6px;line-height:1.7">${msg}</div>
  <div style="display:flex;gap:6px;margin-top:10px">${byType.map(x=>`<div class="typebox"><div class="small">${x.p}</div><b>${x.ok}/${x.all}</b></div>`).join("")}</div></div>
  <div class="card"><b>単語ごとの結果</b><table style="margin-top:6px"><tr><th>単語</th><th>スペル</th><th>意味</th><th>語法</th><th>言い換え</th></tr>
  ${words.map(w=>`<tr><td><b>${w}</b> ${spk(w)}</td><td>${cell(w,"スペル")}</td><td>${cell(w,"意味")}</td><td>${cell(w,"語法")}</td><td>${cell(w,"言い換え")}</td></tr>`).join("")}</table>
  <div class="small" style="margin-top:6px">❌→⭕ ＝ やり直しでクリア</div>
  ${still.length?`<div class="small" style="margin-top:4px">🔁 まだ要復習：${still.map(w=>`<b>${w}</b>`).join("、")}</div>`:""}</div>
  <button class="btn primary" onclick="startTest()">テストをはじめからやり直す</button>
  <button class="btn ghost" onclick="S={mode:'challenge',c:null};render()">✍️ チャレンジモード（英作文）へ</button>
  <button class="btn ghost" onclick="home()">ホームへ</button>`;
 if(lv)confetti(lv==='S');}

// ===== チャレンジモード =====
function viewChallenge(){
 if(S.c===null){
  $("#app").innerHTML=`<div class="card"><b>✍️ チャレンジモード</b><div class="small" style="margin-top:4px;line-height:1.6">英検準2級の英作文に挑戦！点数はつけません。<b>今日の単語を使って書いてみること</b>が目的です。書く内容と、どこでどの単語を使うかはヒントで提案します。</div></div>
   ${CHALLENGES.map((c,k)=>`<button class="mode" onclick="S.c=${k};render();scrollTo(0,0)"><span class="mi">📝</span><span><b>お題${k+1}</b><br>${esc(c.q)}<br><span class="small">${c.ja}</span></span></button>`).join("")}
   <button class="btn ghost" onclick="home()">ホームへ</button>`;return}
 const c=CHALLENGES[S.c];
 $("#app").innerHTML=`<div class="card"><div class="small">${c.kind}</div>
  <div class="q"><b>${esc(c.q)}</b> ${spk(c.q)}<br><span class="small">${c.ja}</span></div></div>
  <div class="card"><b>💡 こんな内容で書いてみたら？</b>
  ${c.plan.map(p=>`<div class="plan"><div><span class="pos">${p.part}</span>${p.idea}</div>
   ${p.word?`<div class="small" style="margin-top:4px">👉 ここで <mark>${p.word}</mark> を使ってみよう</div>`:""}
   <details><summary class="small">書き出しを見る</summary><div class="starter">${hl(p.starter)}</div></details></div>`).join("")}</div>
  <details class="card"><summary><b>📚 言い換えメモ（同じ単語のくり返しを避けたいときに）</b></summary>${WORDS.map(o=>`<div class="relrow"><b>${o.w}</b> → ${o.rel.map(r=>`${r.w}<span class="small">（${r.tag}）</span>`).join("、")}</div>`).join("")}</details>
  <div class="card"><textarea id="es" rows="8" placeholder="I think ..."></textarea>
  <div class="small" id="live">0語 ／ 今日の単語 0/5</div>
  <div id="usedw" style="margin-top:6px"></div>
  <button class="btn primary" onclick="copyPrompt()">📋 AI添削用プロンプトをコピー</button>
  <button class="btn ghost" onclick="const m=$('#model');m.style.display=m.style.display==='none'?'block':'none'">模範解答を見る／とじる</button>
  <div class="model" id="model" style="display:none"><b>模範解答</b><br>${hl(c.model)} ${spk(c.model)}</div></div>
  <button class="btn ghost" onclick="S.c=null;render();scrollTo(0,0)">ほかのお題にする</button>
  <button class="btn ghost" onclick="home()">ホームへ</button>`;
 const ta=$("#es"),upd=()=>{const v=ta.value,n=(v.match(/[A-Za-z']+/g)||[]).length,used=WORDS.map(o=>({w:o.w,ok:new RegExp("\\b"+o.w,"i").test(v)}));
  $("#live").textContent=`${n}語 ／ 今日の単語 ${used.filter(u=>u.ok).length}/5`;
  $("#usedw").innerHTML=used.map(u=>`<span class="chip ${u.ok?'on':''}">${u.ok?'✅':'⬜'} ${u.w}</span>`).join("")};
 ta.oninput=upd;upd();}
function copyPrompt(){const c=CHALLENGES[S.c],v=$("#es").value.trim();if(!v){alert("まず書いてみよう！");return}
 const p=`あなたは英検準2級の英作文の先生です。次の意見論述（目安50〜60語）を、内容・構成・語彙・文法の4観点で各4点満点で採点し、まちがいを日本語でやさしく直してください。\n特に、次の単語を正しく使えているかもチェックしてください：${WORDS.map(o=>o.w).join(", ")}\nお題：${c.q}\n私の答え：\n${v}`;
 navigator.clipboard.writeText(p).then(()=>alert("コピーしました！ChatGPTやGeminiに貼り付けてね"),()=>prompt("コピーしてね",p))}

function confetti(gold){const cs=gold?['#f59e0b','#fcd34d','#fde68a','#d97706']:['#2563eb','#7c3aed','#10b981','#f59e0b','#ef4444'];
 for(let k=0;k<80;k++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cs[k%cs.length];d.style.animationDuration=(2+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}

home();
</script>
</body>
</html>
